name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build_and_deploy.yml"
      - "chrome-extension/**"
      - "landing-page/**"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      extension: ${{ steps.filter.outputs.extension }}
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            extension:
              - '.github/workflows/build_and_deploy.yml'
              - 'chrome-extension/**'
            landing:
              - 'landing-page/**'

  build-extension:
    needs: changes
    if: ${{ needs.changes.outputs.extension == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.24.0"
          package_json_file: chrome-extension/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: chrome-extension/pnpm-lock.yaml

      - name: Install Dependencies
        working-directory: chrome-extension
        run: pnpm install --frozen-lockfile

      - name: Verify Extension Source and Packaging
        working-directory: chrome-extension
        run: |
          pnpm test:unit
          pnpm test:package
          pnpm validate

      - name: Read Validated Manifest Version
        id: manifest
        working-directory: chrome-extension
        run: node -p '"version=" + require("./src/manifest.json").version' >> "$GITHUB_OUTPUT"

      - name: Package Development Extension
        working-directory: chrome-extension
        run: pnpm package

      - name: Verify Development ZIP
        working-directory: chrome-extension
        run: pnpm validate:zip "build/passchef-extension-${{ steps.manifest.outputs.version }}-development.zip"

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: passchef-extension-${{ steps.manifest.outputs.version }}-development
          path: |
            chrome-extension/build/passchef-extension-${{ steps.manifest.outputs.version }}-development.zip
            chrome-extension/build/passchef-extension-${{ steps.manifest.outputs.version }}-development-inventory.json
            chrome-extension/build/passchef-extension-${{ steps.manifest.outputs.version }}-development.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  deploy-landing:
    needs: changes
    if: ${{ needs.changes.outputs.landing == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "landing-page"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
